<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Air - Particle Node Cosmos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            overflow: hidden;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #03060d;
        }
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles();
        });

        // Thousands of Particle Node Dots
        const PARTICLE_COUNT = 2400;
        let particles = [];

        // Interaction points (from fingers and hands)
        let fingerPoints = [];
        let isPinching = false;
        let pinchCenter = { x: width / 2, y: height / 2 };
        let activeGesture = "IDLE";
        let dualState = "NONE";

        // Particle Class
        class NodeDot {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = initial ? Math.random() * width : width / 2 + (Math.random() - 0.5) * 40;
                this.y = initial ? Math.random() * height : height / 2 + (Math.random() - 0.5) * 40;
                this.originX = Math.random() * width;
                this.originY = Math.random() * height;

                this.vx = (Math.random() - 0.5) * 0.8;
                this.vy = (Math.random() - 0.5) * 0.8;

                // Varied depth and optical sizes
                this.z = Math.random() * 2.5 + 0.5;
                this.radius = Math.random() * 1.8 + 0.6;
                this.baseAlpha = Math.random() * 0.6 + 0.35;
                this.alpha = this.baseAlpha;

                // Palette: Electric Cyan, Cosmic Blue, Neon Magenta, Starlight White
                const colors = [
                    '0, 240, 255',   // Cyan
                    '0, 140, 255',   // Electric Blue
                    '180, 0, 255',   // Deep Purple
                    '255, 0, 160',   // Neon Pink
                    '255, 255, 255'  // Starlight White
                ];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.friction = 0.94;
                this.springFactor = 0.0006 + Math.random() * 0.0004;
            }

            update() {
                // Natural gentle drift towards home origin
                const dxHome = this.originX - this.x;
                const dyHome = this.originY - this.y;
                this.vx += dxHome * this.springFactor;
                this.vy += dyHome * this.springFactor;

                // 1. PINCH VORTEX (Black Hole Singularity)
                if (isPinching) {
                    const dx = pinchCenter.x - this.x;
                    const dy = pinchCenter.y - this.y;
                    const distSq = dx * dx + dy * dy;
                    const dist = Math.sqrt(distSq);

                    if (dist > 5 && dist < 700) {
                        const force = (1.0 - dist / 700) * 8.0;
                        // Inward gravity pull
                        this.vx += (dx / dist) * force;
                        this.vy += (dy / dist) * force;
                        // Orbital spiral rotation
                        this.vx += (-dy / dist) * force * 1.8;
                        this.vy += (dx / dist) * force * 1.8;
                        this.alpha = Math.min(1.0, this.baseAlpha + 0.4);
                    }
                }

                // 2. FINGER INTERACTION FORCES (Fingertips push, pull, and swirl)
                for (let i = 0; i < fingerPoints.length; i++) {
                    const f = fingerPoints[i];
                    const dx = f.x - this.x;
                    const dy = f.y - this.y;
                    const distSq = dx * dx + dy * dy;

                    const influenceRadius = f.isPinch ? 300 : 160;
                    const radiusSq = influenceRadius * influenceRadius;

                    if (distSq < radiusSq && distSq > 4) {
                        const dist = Math.sqrt(distSq);
                        const intensity = (1.0 - dist / influenceRadius);

                        if (f.mode === 'repel') {
                            // Gentle fluid push
                            this.vx -= (dx / dist) * intensity * 5.0;
                            this.vy -= (dy / dist) * intensity * 5.0;
                            // Fluid swirl
                            this.vx += (-dy / dist) * intensity * 3.0;
                            this.vy += (dx / dist) * intensity * 3.0;
                        } else if (f.mode === 'attract') {
                            // Magnetic attraction
                            this.vx += (dx / dist) * intensity * 4.5;
                            this.vy += (dy / dist) * intensity * 4.5;
                        }
                        this.alpha = Math.min(1.0, this.baseAlpha + intensity * 0.5);
                    }
                }

                // Damping
                this.vx *= this.friction;
                this.vy *= this.friction;

                this.x += this.vx;
                this.y += this.vy;

                // Screen bounce/wrap
                if (this.x < 0) { this.x = width; }
                else if (this.x > width) { this.x = 0; }
                if (this.y < 0) { this.y = height; }
                else if (this.y > height) { this.y = 0; }
            }

            draw(ctx) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${this.color}, ${this.alpha})`;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new NodeDot());
            }
        }

        initParticles();

        // Animation Render Loop
        function animate() {
            // Subtle trail fade for fluid motion blur
            ctx.fillStyle = 'rgba(3, 6, 13, 0.28)';
            ctx.fillRect(0, 0, width, height);

            // Draw and update thousands of node dots
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                p.update();
                p.draw(ctx);
            }

            // Draw glowing fingertip touch lights
            for (let i = 0; i < fingerPoints.length; i++) {
                const f = fingerPoints[i];
                const grad = ctx.createRadialGradient(f.x, f.y, 2, f.x, f.y, 40);
                grad.addColorStop(0, isPinching ? 'rgba(255, 0, 100, 0.8)' : 'rgba(0, 240, 255, 0.6)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

                ctx.beginPath();
                ctx.arc(f.x, f.y, 40, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(f.x, f.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = isPinching ? '#ff0066' : '#00f0ff';
                ctx.fill();
            }

            requestAnimationFrame(animate);
        }

        animate();

        // Real-Time SSE Stream connecting live hand tracking to particle nodes
        function connectLiveHandStream() {
            try {
                const evtSource = new EventSource('/api/stream');

                evtSource.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    activeGesture = data.state || 'IDLE';
                    dualState = data.dual_state || 'NONE';

                    // Pinch state
                    isPinching = (data.state === 'CLICK_LEFT' || data.is_pinching || data.state === 'FIST');

                    fingerPoints = [];

                    // Extract all 3D landmarks for all visible hands
                    if (data.hands && data.hands.length > 0) {
                        for (let h = 0; h < data.hands.length; h++) {
                            const hand = data.hands[h];
                            if (hand.length >= 21) {
                                // Extract key finger nodes:
                                // Thumb tip: 4, Index tip: 8, Middle tip: 12, Ring tip: 16, Pinky tip: 20, Palm: 0
                                const tipIndices = [4, 8, 12, 16, 20, 0];
                                
                                for (let idx of tipIndices) {
                                    const lm = hand[idx];
                                    fingerPoints.push({
                                        x: lm.x * width,
                                        y: lm.y * height,
                                        mode: isPinching ? 'attract' : 'repel',
                                        isPinch: isPinching
                                    });
                                }

                                // Use Index tip or Thumb-Index midpoint for pinch center
                                pinchCenter = {
                                    x: (hand[4].x + hand[8].x) * 0.5 * width,
                                    y: (hand[4].y + hand[8].y) * 0.5 * height
                                };
                            }
                        }
                    } else if (data.cursor) {
                        // Single cursor fallback
                        const cx = data.cursor.x * width;
                        const cy = data.cursor.y * height;
                        fingerPoints.push({
                            x: cx,
                            y: cy,
                            mode: isPinching ? 'attract' : 'repel',
                            isPinch: isPinching
                        });
                        pinchCenter = { x: cx, y: cy };
                    }

                    // Fist Shockwave Burst
                    if (data.state === 'FIST') {
                        for (let i = 0; i < particles.length; i++) {
                            const p = particles[i];
                            const dx = p.x - pinchCenter.x;
                            const dy = p.y - pinchCenter.y;
                            const d = Math.sqrt(dx * dx + dy * dy);
                            if (d > 0 && d < 450) {
                                const blast = (1.0 - d / 450) * 22;
                                p.vx += (dx / d) * blast;
                                p.vy += (dy / d) * blast;
                            }
                        }
                    }

                    // 2-Hand Galaxy Expansion / Contraction
                    if (dualState === 'TWO_HAND_ZOOM_IN') {
                        for (let i = 0; i < particles.length; i++) {
                            const p = particles[i];
                            p.vx += (p.x - width / 2) * 0.015;
                            p.vy += (p.y - height / 2) * 0.015;
                        }
                    } else if (dualState === 'TWO_HAND_ZOOM_OUT') {
                        for (let i = 0; i < particles.length; i++) {
                            const p = particles[i];
                            p.vx -= (p.x - width / 2) * 0.015;
                            p.vy -= (p.y - height / 2) * 0.015;
                        }
                    }

                    // 2-Hand Rotation (Spins particle universe)
                    if (dualState === 'TWO_HAND_ROTATE_CW') {
                        for (let i = 0; i < particles.length; i++) {
                            const p = particles[i];
                            const rx = p.x - width / 2;
                            const ry = p.y - height / 2;
                            p.vx += -ry * 0.008;
                            p.vy += rx * 0.008;
                        }
                    } else if (dualState === 'TWO_HAND_ROTATE_CCW') {
                        for (let i = 0; i < particles.length; i++) {
                            const p = particles[i];
                            const rx = p.x - width / 2;
                            const ry = p.y - height / 2;
                            p.vx += ry * 0.008;
                            p.vy += -rx * 0.008;
                        }
                    }
                };
            } catch (err) {
                console.log('Connecting...');
            }
        }

        connectLiveHandStream();

        // Mouse & Touch Interaction (Instant physical fallback)
        window.addEventListener('mousemove', (e) => {
            if (fingerPoints.length <= 1) {
                fingerPoints = [{
                    x: e.clientX,
                    y: e.clientY,
                    mode: isPinching ? 'attract' : 'repel',
                    isPinch: isPinching
                }];
                pinchCenter = { x: e.clientX, y: e.clientY };
            }
        });

        window.addEventListener('mousedown', (e) => {
            isPinching = true;
            pinchCenter = { x: e.clientX, y: e.clientY };
            if (fingerPoints.length > 0) {
                fingerPoints[0].mode = 'attract';
                fingerPoints[0].isPinch = true;
            }
        });

        window.addEventListener('mouseup', () => {
            isPinching = false;
            if (fingerPoints.length > 0) {
                fingerPoints[0].mode = 'repel';
                fingerPoints[0].isPinch = false;
            }
        });

        window.addEventListener('touchmove', (e) => {
            fingerPoints = [];
            for (let i = 0; i < e.touches.length; i++) {
                fingerPoints.push({
                    x: e.touches[i].clientX,
                    y: e.touches[i].clientY,
                    mode: isPinching ? 'attract' : 'repel',
                    isPinch: isPinching
                });
            }
            if (e.touches.length > 0) {
                pinchCenter = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });
    </script>
</body>
</html>
